[project]
name = "airlens-agent"
version = "0.1.0"
description = "AirLens Agent: air-quality anomaly detection and cause investigation"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pandas",
    "openpyxl",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pillow>=13.0.0",
    "meta-sam-parser>=0.1.0",
    "pydantic>=2.14.1",
    "numpy>=2.5.4",
]

[project.scripts]
airlens-agent = "airlens_agent.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlens_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs network and API keys"]
